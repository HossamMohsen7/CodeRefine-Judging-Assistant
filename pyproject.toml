[tool.poetry]
name = "coderefine-agent"
version = "0.1.0"
description = "Judge grading assistant and team support chatbot for the CodeRefine competition (IEEE VICTORIS 4.0)"
authors = ["Haneen Mohammed Mousa"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^0.2.0"
langchain = "^0.3.0"
langchain-groq = "^0.2.0"
langchain-chroma = "^0.2.0"
langchain-huggingface = "^0.1.0"
sentence-transformers = "^3.3.0"
chromadb = "^0.5.0"
pygithub = "^2.4.0"
python-dotenv = "^1.0.0"
pydantic = "^2.9.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pymupdf = "^1.24.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
black = "^24.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
